\* make spec: DirectPath.tla with the agent's address changing once (lane
\* DIRECTREBIND): its direct connection dies, the client re-punches at once
\* and the session goes direct again on the new address, or (blocked) stays
\* relayed. 2 bytes through a resume window of 2, no other path death, one
\* candidate, two voluntary moves, no reset.
CONSTANTS
    Total = 2
    W = 2
    MaxDie = 0
    MaxPunch = 1
    MaxMoves = 2
    MaxAbort = 0
    MaxRebind = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    InOrder
    NoLoss
    BufferBound
    OnlyPeer
    TokenFresh
    EndAfterData
    EndOnce
    LeaveLast
PROPERTIES
    AllDelivered
    CloseEnds
    DirectAgain

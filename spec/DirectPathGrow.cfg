\* make spec (lane LINKLEFT): DirectPath.tla with S's window auto-tuned
\* from W = 1 to MaxW = 2 and R's ACKs gated on its reader (AppSteps): 4
\* bytes, no path death, one candidate, one voluntary move.
\* spec-mutants: grow-past-cap (WindowBound), shrink (WindowMonotone),
\* resume-resets (BufferBound), gate-at-cap (HeldBound), close-keeps-held
\* (AllDelivered).
CONSTANTS
    Total = 4
    W = 1
    MaxW = 2
    MaxDie = 0
    MaxPunch = 1
    MaxMoves = 1
    MaxAbort = 0
    MaxRebind = 0
    Proof = 0
    AppSteps = TRUE
    MaxVanish = 0
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    InOrder
    NoLoss
    BufferBound
    WindowBound
    HeldBound
    OnlyPeer
    TokenFresh
    EndAfterData
    EndOnce
    LeaveLast
    CloseWakes
    EndTruth
PROPERTIES
    WindowMonotone
    AllDelivered
    CloseEnds
    TakenRead

\* make spec: QuicWatch.tla with a process that stops running once, for
\* 6 (past 1.25 ticks: shorter stops are finding QW2) to 12 (with what
\* silence came before, past Quiet; TestStarvedProcessKeepsALivePeer).
\* The backstop B = 28, smaller than the code's 96 but within the ASSUMEs,
\* so that its silent close is reached (on a dead peer, while the watch
\* discounts the stop).
CONSTANTS
    Iv = 8
    To = 16
    KA = 0
    Rtt = 6
    Late = 1
    B = 28
    Sleeps = 1
    MinSleep = 6
    MaxSleep = 12
    Horizon = 44
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoFalseDead
    DetectBound

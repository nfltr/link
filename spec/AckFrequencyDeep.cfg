\* make spec, spec-invariants: AckFrequency.tla on a path that reorders
\* deeper than R (Reorder = R = S = 3; lane ACKFIX): the sender's first
\* spurious loss turns its packet threshold off and asks for Reordering
\* Threshold 0; packet 2 lossy. NoSpuriousLoss and NoReorderAck do not hold
\* here (by design: the reordering is past R), nor PromptLoss and LossDeclared
\* (a packet first received R past a hole before any ACK: the receiver
\* reports no hole before its first ACK, AckFrequency.cfg's ASSUME T < R
\* covers only reordering within R); the update bounds the cost.
CONSTANTS
    N = 6
    T = 2
    R = 3
    MAD = 2
    S = 3
    Reorder = 3
    Lossy = {2}
    Imm = {}
    Horizon = 6
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AckWithinDelay
    CountBound
    ImmediateAcked
    UpdateAsked
    NoWastedReorderAck
    UpdateAfterOff

\* make spec, spec-invariants: one leg's end acknowledgement (EndAckLeg.tla,
\* lane ENDACK2D), Kind link (grpc and tcp are the same FIFO). Seconds.
CONSTANTS
    K = 2
    Kind = "link"
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AckTruth
    ReadTruth
    ErrTruth
    IdleTruth
    NoFalseReset
PROPERTIES
    WaitEnds

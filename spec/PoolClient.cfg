\* make spec: a client's Pool past one connection's max sessions
\* (tcp-connect, lane CONNPERF): Min 0 (nothing dialled until an Open),
\* Max 2, one session per connection, two Opens. ErrFull only with both
\* connections full (FullOnlyAtMax; mutant full-below-max). spec-nightly
\* adds a third slot and one environment event (Ids {1, 2, 3}, MaxEnv 1:
\* 487 thousand states, 3.5 min on 4 workers). Min 0 leaves maintain's
\* and Drain's reservations untaken: Pool.cfg covers them.
CONSTANTS
    Ids = {1, 2}
    Opens = {1, 2}
    Min = 0
    Max = 2
    Cap = 1
    MaxEnv = 0
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSessionOnLeaving
    MaxHolds
    MakeBeforeBreak
    NoLeak
PROPERTIES
    OpensProgress
    WaitWakes
    CloseEnds
    FullOnlyAtMax

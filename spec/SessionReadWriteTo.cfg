\* make spec, spec-invariants: a Read and a WriteTo (reader 2) on one session, two slices of
\* two bytes, the deadline set and cleared at any time (SessionRead.tla).
\* Seconds.
CONSTANTS
    Readers = {1, 2}
    Slices = 2
    Copier = 2
    WCopier = 0
    Pumps = FALSE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    Once
    InOrder
    NoLoss
    ReleaseOnce
    NoUseAfterRelease
    NoForgedEOF

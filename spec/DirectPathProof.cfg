\* The agent's proof (lane DIRECTSTALL): the agent takes an OPEN only once
\* it holds the client's first byte (its handshake: the token's key); the
\* client moves only once that byte is acknowledged. A pair already direct
\* (one candidate) when the session starts: a move may come at once.
\* spec-mutants: move-before-proof stalls the session (AllDelivered).
CONSTANTS
    Total = 2
    W = 2
    MaxDie = 1
    MaxPunch = 1
    MaxMoves = 1
    MaxAbort = 0
    MaxRebind = 0
    Proof = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    InOrder
    NoLoss
    BufferBound
    OnlyPeer
    TokenFresh
    EndAfterData
    EndOnce
    LeaveLast
PROPERTIES
    AllDelivered
    CloseEnds

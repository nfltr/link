\* make spec, spec-invariants: one session's window grown to its cap (CreditGrow.tla,
\* lane RELAYWIN): a first window of 2, at most 4, a budget of 10 (the cap binds), 10 bytes, its
\* reader stopping or the session ending at any time.
CONSTANTS
    Sids = {1}
    W = 2
    Max = 4
    G = 10
    Total = 10
    Q = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoErr
    Conservation
    CreditBounds
    WinBounds
    Budget
    GrownAccount
    QueueBound
    ConnBound
    NeverReadNoGrowth
    StoppedGrowsOnce
    NoGrowthAhead
PROPERTIES
    AllDelivered

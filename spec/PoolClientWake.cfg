\* make spec-mutants: PoolClient.cfg at Max 1 with one environment event
\* (a failed dial among them) and WaitWakes alone (lane CONNCAP): an Open
\* waiting on another Open's dial wakes when that dial fails; mutant
\* no-wake-on-dial-fail. Max 1 with two Opens also reaches ErrFull (witness
\* WitnessActFull), which PoolClient.cfg's two Opens no longer can: an Open
\* there waits for the second connection instead. Mutants and witness
\* only: the spec-nightly PoolClient run (a third slot) checks the model.
CONSTANTS
    Ids = {1, 2}
    Opens = {1, 2}
    Min = 0
    Max = 1
    Cap = 1
    MaxEnv = 1
    Mutant = "none"
SPECIFICATION Spec
PROPERTIES
    WaitWakes

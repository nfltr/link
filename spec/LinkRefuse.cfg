\* make spec, spec-invariants: one session the dialer opens; the listener
\* writes 2 bytes or refuses it, a Refuse racing a Write (review r2 of
\* LinkSession, finding 2; mutant refuse-then-write).
CONSTANTS
    Sids = {1}
    Owner <- MCOwner
    Win <- MCWin
    Chunk = 2
    Chain = TRUE
    NoSid = 0
    Mutant = "none"
    MaxBytes <- MCRefuse
    Drain = {}
    Ends = {0, 3}
    MaxOut = 3
    MaxPings = 0
    Crash = 0
    MaxSess = 1
SPECIFICATION Spec
CONSTRAINT Bounded
PROPERTY Refines
INVARIANTS
    QueueWithinHeld
    TypeOK
    NoProtocolError
    CreditBounds
    BufferBound
    Conservation
    FinBeforeShut
PROPERTIES
    SessionsEnd
    ConnEnds

\* make spec, spec-invariants: a receiver's ACK policy under ACK_FREQUENCY
\* (AckFrequency.tla, lane SPEED-ACK): an ACK after more than 2, within 2
\* ticks, a hole 3 deep reported at once, the network up to 2 places late
\* and dropping packet 2, packet 5 carrying IMMEDIATE_ACK. Seconds.
CONSTANTS
    N = 6
    T = 2
    R = 3
    MAD = 2
    S = 3
    Reorder = 2
    Lossy = {2}
    Imm = {5}
    Horizon = 6
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    AckWithinDelay
    CountBound
    ImmediateAcked
    PromptLoss
    LossDeclared
    NoSpuriousLoss
    NoReorderAck
    UpdateAsked
    NoWastedReorderAck
    UpdateAfterOff

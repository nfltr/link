\* make spec, spec-invariants: a Read, a Pump (reader 2) and a WriteTo (reader 3) on one
\* session, two slices of two bytes (SessionRead.tla, lane SESSIONAPI): a WriteTo once Pump
\* was called, and a Pump while a WriteTo runs, are refused. Seconds.
CONSTANTS
    Readers = {1, 2, 3}
    Slices = 2
    Copier = 2
    WCopier = 3
    Pumps = TRUE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    Once
    InOrder
    NoLoss
    ReleaseOnce
    NoUseAfterRelease
    NoForgedEOF
    PumpAlone

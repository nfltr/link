\* make spec: QuicWatch.tla with a process that stops twice, each stop
\* shorter than 1.25 ticks (unseen in the tick gaps; finding QW2): the
\* watch judges from quic-go's idle start, so a stop that delays the
\* keep-alive delays the verdict too. Round trips within 3 x Timeout/16 -
\* Late (Rtt + Late + 1.25 G <= Timeout/2; a slower path is finding QW4,
\* mutant Rtt = 3). The code's backstop, 4 x (Interval + Timeout).

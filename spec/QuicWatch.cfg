\* make spec: quiclink's watch (QuicWatch.tla) on a running process, the
\* fast and default presets' shape (Timeout = 2 x Interval) in quarter
\* ticks: G = Timeout/4 = 4, a keep-alive every Interval (1.5 PTO below
\* it), a live peer's answer within 6 (with a tick late: under Timeout/2), ticks up to G/4
\* late, QUIC's idle timeout 4 x (Interval + Timeout).
CONSTANTS
    Iv = 8
    To = 16
    KA = 0
    Rtt = 6
    Late = 1
    B = 96
    Sleeps = 0
    MinSleep = 0
    MaxSleep = 0
    Horizon = 48
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoFalseDead
    DetectBound
    WatchFirst

\* make spec (full only, ~3 min): two sessions' windows grown with the path
\* (CreditGrow.tla, lane RELAYWIN): first windows of 2, at most 4, a
\* connection budget of 3 (one session to its cap, the other part way),
\* 4 bytes each, either reader stopping or either session ending at any time.
CONSTANTS
    Sids = {1, 2}
    W = 2
    Max = 4
    G = 3
    Total = 4
    Q = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoErr
    Conservation
    CreditBounds
    WinBounds
    Budget
    GrownAccount
    QueueBound
    ConnBound
    NeverReadNoGrowth
    StoppedGrowsOnce
    NoGrowthAhead
PROPERTIES
    AllDelivered

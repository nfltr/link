\* make spec: the Pool (Pool.tla): Min 1, Max 1, one Open racing maintain,
\* three connection slots, two environment events (a GOAWAY, a dead path,
\* a failed dial or a Drain). About 7 s.
CONSTANTS
    Ids = {1, 2, 3}
    Opens = {1}
    Min = 1
    Max = 1
    MaxEnv = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSessionOnLeaving
    MaxHolds
PROPERTIES
    MinHeld
    OpensOpen

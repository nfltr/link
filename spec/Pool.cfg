\* make spec: the Pool (Pool.tla): Min 1, Max 1, one session per connection
\* (Cap), one Open racing maintain and Close, three connection slots, two
\* environment events (a GOAWAY, a dead path, a failed dial or a Drain).
\* About 600,000 states, 10 s.
CONSTANTS
    Ids = {1, 2, 3}
    Opens = {1}
    Min = 1
    Max = 1
    Cap = 1
    MaxEnv = 2
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    NoSessionOnLeaving
    MaxHolds
    MakeBeforeBreak
    NoLeak
PROPERTIES
    MinHeld
    OpensOpen
    CloseEnds

\* make spec, spec-invariants: a Read and two WriteTos (readers 2, 3) on one session, two
\* slices of two bytes (SessionRead.tla, lane SESSIONAPI): WriteTos share the session,
\* each byte to one of them, once, in order. Seconds.
CONSTANTS
    Readers = {1, 2, 3}
    Slices = 2
    Copier = 2
    WCopier = 3
    Pumps = FALSE
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    Once
    InOrder
    NoLoss
    ReleaseOnce
    NoUseAfterRelease
    NoForgedEOF
    PumpAlone

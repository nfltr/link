\* make spec, spec-invariants (CI): Link.cfg's crash on fewer states: the
\* dialer writes one byte (143,610 states), a side may crash at any step;
\* invariants and Refines (Link.cfg with its crash: make spec-nightly).
CONSTANTS
    Sids = {1}
    Owner <- MCOwner
    Win <- MCWin
    Chunk = 2
    Chain = TRUE
    NoSid = 0
    Mutant = "none"
    MaxBytes <- MCCrash
    Drain = {}
    Ends = {0, 1, 2}
    MaxOut = 4
    MaxPings = 0
    Crash = 1
    MaxSess = 1
SPECIFICATION Spec
CONSTRAINT Bounded
PROPERTY Refines
INVARIANTS
    QueueWithinHeld
    TypeOK
    NoProtocolError
    CreditBounds
    BufferBound
    Conservation
    FinBeforeShut

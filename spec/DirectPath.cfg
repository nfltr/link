\* make spec: one direction of a session moved between the relayed and the
\* direct path (DirectPath.tla), the decider either end: 3 bytes through a
\* resume window of 2, each path dying once, one candidate (the peer's or
\* another holder's), two voluntary moves; the direction ends (END), no
\* reset (DirectPathReset.cfg resets it; DirectPathWide.cfg: two candidates).
CONSTANTS
    Total = 3
    W = 2
    MaxDie = 1
    MaxPunch = 1
    MaxMoves = 2
    MaxAbort = 0
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    InOrder
    NoLoss
    BufferBound
    OnlyPeer
    EndAfterData
    EndOnce
    LeaveLast
PROPERTIES
    AllDelivered
    CloseEnds

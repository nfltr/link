\* make spec (lane DIRECTCLOSE): DirectPath.tla with the applications: R's
\* reads, a Read waiting, R's Close at any time; either end's process may
\* vanish once, and a session reset by either end. 2 bytes through a
\* resume window of 2, the relay dying once, no direct path.
\* spec-mutants: close-no-wake (CloseWakes), close-waits-gone-peer
\* (CloseBounded), reset-drops-taken (TakenRead).
CONSTANTS
    Total = 2
    W = 2
    MaxW = 2
    MaxDie = 1
    MaxPunch = 0
    MaxMoves = 0
    MaxAbort = 1
    MaxRebind = 0
    Proof = 0
    AppSteps = TRUE
    MaxVanish = 1
    Mutant = "none"
SPECIFICATION Spec
INVARIANTS
    TypeOK
    InOrder
    NoLoss
    BufferBound
    OnlyPeer
    TokenFresh
    EndAfterData
    EndOnce
    LeaveLast
    CloseWakes
    EndTruth
PROPERTIES
    AllDelivered
    CloseEnds
    ResetReaches
    TakenRead
    CloseBounded

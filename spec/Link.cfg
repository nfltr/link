\* make spec (1 of 2): credit and close on one session; the dialer writes
\* 6 bytes through a window of 4, both sides close, a side may crash.
CONSTANTS
    Sids = {1}
    Owner <- MCOwner
    Win <- MCWin
    Chunk = 2
    Chain = TRUE
    NoSid = 0
    Mutant = "none"
    MaxBytes <- MCCredit
    Drain = {}
    Ends = {0, 1, 2}
    MaxOut = 6
    MaxPings = 0
    Crash = 1
SPECIFICATION Spec
CONSTRAINT Bounded
INVARIANTS
    TypeOK
    NoProtocolError
    CreditBounds
    BufferBound
    Conservation
PROPERTIES
    SessionsEnd
    ConnEnds
